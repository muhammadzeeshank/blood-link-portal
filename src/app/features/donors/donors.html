<div class="space-y-6 animate-fade-in">
  <!-- Page Header -->
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
    <div>
      <h1 class="text-3xl font-bold text-slate-800 dark:text-white tracking-tight">Donors</h1>

      <!-- Breadcrumbs -->
      <div class="card flex justify-center">
        <p-breadcrumb [model]="items" [home]="home" />
      </div>
    </div>
    <div class="flex gap-3">
      <app-button variant="secondary" icon="pi pi-upload">Export</app-button>
      <app-button variant="primary" icon="pi pi-plus" routerLink="/donors/new"
        >Add New Donor</app-button
      >
    </div>
  </div>

  <!-- Main Content Card (Reusable List Layout) -->
  <div
    class="bg-white dark:bg-slate-900 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-800 flex flex-col overflow-hidden transition-colors"
  ></div>
</div>
