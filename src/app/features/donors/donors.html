<div class="space-y-5 animate-fade-in">
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
    <div>
      <!-- <h1 class="text-3xl font-bold text-slate-800 dark:text-white tracking-tight">Donors</h1> -->
      <div class="card flex justify-start -ml-3">
        <p-breadcrumb [model]="items" [home]="home" />
      </div>
    </div>
    <div class="flex gap-3">
      <app-button variant="secondary" icon="pi pi-upload">Export</app-button>
      <app-button variant="primary" icon="pi pi-plus" routerLink="/donors/new">Add New Donor</app-button>
    </div>
  </div>

  <div class="bg-surface-0 dark:bg-surface-900 rounded-2xl shadow-sm border border-surface-100 dark:border-surface-800 flex flex-col overflow-hidden transition-colors">
    
    <p-table
      #dt
      [value]="donors()"
      [loading]="loading()"
      [paginator]="true"
      [rows]="10"
      [rowsPerPageOptions]="[5, 10, 20, 50]"
      [globalFilterFields]="['name', 'location', 'bloodGroup']"
      dataKey="id"
      styleClass="p-datatable-striped"
      [tableStyle]="{ 'min-width': '60rem' }"
    >
      <ng-template pTemplate="caption">
        <div class="flex flex-col sm:flex-row justify-between items-center gap-4 p-2">
          <span class="text-lg font-semibold text-slate-800 dark:text-slate-100">Donor Directory</span>
          
          <p-iconField iconPosition="left">
            <p-inputIcon styleClass="pi pi-search" />
            <input 
              pInputText 
              type="text" 
              (input)="onGlobalFilter(dt, $event)" 
              placeholder="Search by name, location..." 
              class="w-full sm:w-80"
            />
          </p-iconField>
        </div>
      </ng-template>

      <ng-template pTemplate="header">
        <tr>
          <th pSortableColumn="name" style="width: 25%">
            Name <p-sortIcon field="name" />
          </th>
          <th pSortableColumn="bloodGroup" style="width: 15%">
            Blood Group <p-sortIcon field="bloodGroup" />
            <p-columnFilter type="text" field="bloodGroup" display="menu" matchMode="in" [showMatchModes]="false" [showOperator]="false" [showAddButton]="false">
              <ng-template pTemplate="filter" let-value let-filter="filterCallback">
                <p-multiSelect 
                  [ngModel]="value" 
                  [options]="bloodGroups" 
                  placeholder="Any" 
                  (onChange)="filter($event.value)" 
                  optionLabel="label" 
                  optionValue="value">
                </p-multiSelect>
              </ng-template>
            </p-columnFilter>
          </th>
          <th pSortableColumn="location" style="width: 20%">
            Location <p-sortIcon field="location" />
          </th>
          <th pSortableColumn="lastDonationDate" style="width: 15%">
            Last Donation <p-sortIcon field="lastDonationDate" />
          </th>
          <th pSortableColumn="status" style="width: 15%">
            Status <p-sortIcon field="status" />
            <p-columnFilter field="status" matchMode="equals" display="menu" [showMatchModes]="false" [showOperator]="false" [showAddButton]="false">
              <ng-template pTemplate="filter" let-value let-filter="filterCallback">
                <p-multiSelect 
                  [ngModel]="value" 
                  [options]="statuses" 
                  placeholder="Any" 
                  (onChange)="filter($event.value)" 
                  optionLabel="label" 
                  optionValue="value">
                </p-multiSelect>
              </ng-template>
            </p-columnFilter>
          </th>
          <th style="width: 10%; text-align: center">Actions</th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-donor>
        <tr>
          <td class="font-medium text-slate-800 dark:text-slate-200">
            {{ donor.name }}
          </td>
          <td>
            <span class="inline-flex items-center justify-center px-2 py-1 text-xs font-bold rounded bg-rose-100 text-rose-700 dark:bg-rose-900/30 dark:text-rose-400">
              {{ donor.bloodGroup }}
            </span>
          </td>
          <td class="text-slate-600 dark:text-slate-400">
            {{ donor.location }}
          </td>
          <td class="text-slate-600 dark:text-slate-400">
            {{ donor.lastDonationDate ? (donor.lastDonationDate | date:'mediumDate') : 'Never' }}
          </td>
          <td>
            <p-tag [value]="donor.status" [severity]="getSeverity(donor.status)" />
          </td>
          <td class="text-center">
            <div class="flex items-center justify-center gap-2">
              <p-button icon="pi pi-pencil" [rounded]="true" [text]="true" severity="secondary" size="small" pTooltip="Edit Donor" tooltipPosition="bottom" />
              <p-button icon="pi pi-trash" [rounded]="true" [text]="true" severity="danger" size="small" pTooltip="Delete Donor" tooltipPosition="bottom" />
            </div>
          </td>
        </tr>
      </ng-template>

      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="6" class="text-center p-8 text-slate-500 dark:text-slate-400">
            No donors found. Try adjusting your search or filters.
          </td>
        </tr>
      </ng-template>
    </p-table>

  </div>
</div>
